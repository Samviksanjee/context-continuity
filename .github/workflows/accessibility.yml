name: Accessibility and build

on:
  push:
    branches: [main, master]
  pull_request: {}

jobs:
  web:
    name: Web (type-check, accessibility tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build

  android:
    name: Android (unit tests, assemble debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests and assemble
        working-directory: android-contextos
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
